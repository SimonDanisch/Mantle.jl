<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Electron inherits FONTCONFIG_FILE: the system conf.d files use syntax the
     bundled fontconfig does not parse and print a page of warnings each launch. -->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
