name: Mantle

on:
  pull_request:
    branches: [main, sd/lava-refactor]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mantle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }} tests (Julia ${{ matrix.julia }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { julia: '1.12', name: Lavapipe, backend: vulkan, os: ubuntu-24.04 }
          - { julia: '1.13', name: Lavapipe, backend: vulkan, os: ubuntu-24.04 }
          - { julia: '1.14', name: Lavapipe, backend: vulkan, os: ubuntu-24.04 }
          - { julia: '1.13', name: Metal, backend: metal, os: macos-26 }
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan loader and virtual display
        if: matrix.backend == 'vulkan'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 vulkan-validationlayers xauth xvfb
      - uses: julia-actions/setup-julia@v2
        with:
          # Include tagged 1.14 prereleases until 1.14 is released.
          version: ${{ matrix.julia == '1.14' && '~1.14.0-0' || matrix.julia }}
      - uses: julia-actions/cache@v2
      # The adaptive mesh tests use Hikari's geometry routines and compile
      # their own kernels. Skip the dependency's shader warmup.
      - name: Configure the Hikari test dependency
        run: |
          cat >> LocalPreferences.toml <<'EOF'

          [Hikari]
          precompile_workload = false
          EOF
      - name: Run Mantle tests
        env:
          MANTLE_TEST_LAVAPIPE: ${{ matrix.backend == 'vulkan' && 'true' || 'false' }}
          MANTLE_TEST_METAL: ${{ matrix.backend == 'metal' && 'true' || 'false' }}
          JULIA_NUM_THREADS: '4'
          JULIA_TEST_RECORD_PASSES: ${{ matrix.julia == '1.13' && 'true' || 'false' }}
          MANTLE_TEST_INVENTORY: ${{ matrix.julia == '1.13' && format('{0}/mantle-tests', runner.temp) || '' }}
        run: |
          set --
          if [ "$MANTLE_TEST_LAVAPIPE" = true ]; then
            set -- xvfb-run -a
          fi
          "$@" julia --project=. --color=yes -e 'using Pkg; Pkg.instantiate(); Pkg.test(; julia_args = `--check-bounds=auto`)'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() && matrix.julia == '1.13' }}
        with:
          name: mantle-tests-${{ matrix.backend }}
          path: ${{ runner.temp }}/mantle-tests/*.tsv
          if-no-files-found: error

  test-parity:
    name: Metal and Lavapipe test parity
    runs-on: ubuntu-24.04
    needs: test
    if: ${{ always() && !cancelled() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mantle-tests-*
      - name: Compare the assertions run on Julia 1.13
        run: |
          export LC_ALL=C
          test -s mantle-tests-vulkan/suite.tsv
          test -s mantle-tests-metal/suite.tsv
          sort mantle-tests-vulkan/*.tsv > vulkan.tsv
          sort mantle-tests-metal/*.tsv > metal.tsv
          comm -23 vulkan.tsv metal.tsv > missing-on-metal.tsv
          comm -13 vulkan.tsv metal.tsv > extra-on-metal.tsv
          wc -l missing-on-metal.tsv extra-on-metal.tsv
          if [ -s missing-on-metal.tsv ] || [ -s extra-on-metal.tsv ]; then
            echo "::error::Metal and Lavapipe ran different tests. See the test-parity report."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !cancelled() }}
        with:
          name: test-parity
          path: |
            missing-on-metal.tsv
            extra-on-metal.tsv

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the documentation
        run: |
          python -m pip install mkdocs==1.6.1
          python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: mantle-docs
          path: site/
          if-no-files-found: error
